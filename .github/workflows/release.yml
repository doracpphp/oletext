# Builds cmd/oletext for the common platforms and attaches the archives to a
# GitHub Release whenever a version tag (v1.2.3) is pushed.
#
#   git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Cross-compile
        run: |
          set -eu
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/}
            bin=oletext
            [ "$os" = windows ] && bin=oletext.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "-s -w" -o "$bin" ./cmd/oletext
            name="oletext_${GITHUB_REF_NAME}_${os}_${arch}"
            if [ "$os" = windows ]; then
              zip -q "dist/$name.zip" "$bin"
            else
              tar czf "dist/$name.tar.gz" "$bin"
            fi
            rm "$bin"
          done
          (cd dist && sha256sum ./* > checksums.txt)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes
